# sa の egress プロキシ（design.md §9「隔離と外向き通信」、docs/plan.md D4）。
# sa のコンテナは外へ出る経路の無い内部ネットワークにだけ繋がり、外へ出られるのはこのプロキシだけ。
# 通すのは LLM API への HTTPS（443 への CONNECT）だけ。それ以外は拒否し、拒否も含めて全リクエストを標準出力に記録する
# （逸脱の検知: docker compose -f docker/compose.yaml logs egress-proxy | grep DENIED）。

http_port 3128

acl llm_api dstdomain api.anthropic.com
acl https_port port 443
acl CONNECT method CONNECT

http_access allow CONNECT llm_api https_port
http_access deny all

# 記録は標準出力・標準エラーへ（コンテナのログで見る）。キャッシュはしない
logformat sa %{%Y-%m-%dT%H:%M:%S}tl %>a %rm %ru %>Hs %Ss
access_log stdio:/dev/stdout sa
cache_log stdio:/dev/stderr
cache deny all
pid_filename none
logfile_rotate 0
coredump_dir /tmp
shutdown_lifetime 1 seconds

# 中継先にクライアントのアドレスを渡さない
forwarded_for delete
